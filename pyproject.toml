[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard-eval"
version = "0.1.0"
description = "Paired regression checks for versioned LLM features"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.3,<7"]

[project.scripts]
modelguard = "modelguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
